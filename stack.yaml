version: "3.8"

services:
  web:
    image: localhost:6008/serebryakov-08/probe:${VERSION}
    environment:
      MARKER: netlab
      APP_PORT: "5008"
      DATABASE_URL: mysql://root:lab@db:3306/lab
    ports:
      - "8024:5008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/notes',
      timeout=5).read()"]
      interval: 3s
      timeout: 6s
      start_period: 30s
      retries: 3
    networks: [net]
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 20s

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: lab
      MARIADB_DATABASE: lab
    volumes:
      - data:/var/lib/mysql
    networks: [net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  net:
    driver: overlay
    ipam:
      config:
        - subnet: 10.28.0.0/24

volumes:
  data:
